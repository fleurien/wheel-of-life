<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Wheel of Life Generator</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				padding: 20px;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.container {
				background: white;
				border-radius: 20px;
				padding: 30px;
				max-width: 1200px;
				width: 100%;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			}

			h1 {
				text-align: center;
				color: #333;
				margin-bottom: 30px;
				font-size: 2em;
			}

			.controls {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 20px;
				margin-bottom: 30px;
			}

			.control-group {
				display: flex;
				flex-direction: column;
			}

			label {
				font-weight: 600;
				margin-bottom: 8px;
				color: #555;
			}

			input,
			select {
				padding: 10px;
				border: 2px solid #ddd;
				border-radius: 8px;
				font-size: 1em;
				transition: border-color 0.3s;
			}

			input:focus,
			select:focus {
				outline: none;
				border-color: #667eea;
			}

			.labels-section {
				margin-bottom: 30px;
			}

			.labels-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
				gap: 15px;
				margin-top: 15px;
			}

			.label-input-group {
				display: flex;
				flex-direction: column;
			}

			.label-input-group label {
				font-size: 0.9em;
				margin-bottom: 5px;
			}

			.ratings-section {
				margin-bottom: 30px;
			}

			.ratings-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
				gap: 15px;
				margin-top: 15px;
			}

			.rating-input-group {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.rating-input-group label {
				flex: 1;
				margin: 0;
			}

			.rating-input-group input {
				width: 80px;
			}

			.canvas-container {
				display: flex;
				justify-content: center;
				margin: 30px 0;
				background: #f8f9fa;
				border-radius: 12px;
				padding: 20px;
			}

			canvas {
				max-width: 100%;
				height: auto;
			}

			.buttons {
				display: flex;
				gap: 15px;
				justify-content: center;
				flex-wrap: wrap;
			}

			button {
				padding: 12px 30px;
				font-size: 1em;
				font-weight: 600;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
				color: white;
			}

			button:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
			}

			button:active {
				transform: translateY(0);
			}

			.btn-primary {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			}

			.btn-secondary {
				background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
			}

			.btn-success {
				background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
			}

			@media (max-width: 768px) {
				.container {
					padding: 20px;
				}

				h1 {
					font-size: 1.5em;
				}

				.controls {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>🎯 Wheel of Life Generator</h1>

			<div class="controls">
				<div class="control-group">
					<label for="numAreas">Number of Areas:</label>
					<input type="number" id="numAreas" min="3" max="12" value="8" />
				</div>

				<div class="control-group">
					<label for="ratingScale">Rating Scale:</label>
					<select id="ratingScale">
						<option value="5">Out of 5</option>
						<option value="10" selected>Out of 10</option>
					</select>
				</div>

				<div class="control-group">
					<label for="displayStyle">Display Style:</label>
					<select id="displayStyle">
						<option value="filled">Filled Segments</option>
						<option value="spider">Spider Web</option>
					</select>
				</div>
			</div>

			<div class="labels-section">
				<h2>Area Labels</h2>
				<div class="labels-grid" id="labelsGrid"></div>
			</div>

			<div class="ratings-section">
				<h2>Ratings (Optional - for filled version)</h2>
				<div class="ratings-grid" id="ratingsGrid"></div>
			</div>

			<div class="canvas-container">
				<canvas id="wheelCanvas" width="600" height="600"></canvas>
			</div>

			<div class="buttons">
				<button class="btn-primary" onclick="drawWheel()">Update Wheel</button>
				<button class="btn-secondary" onclick="downloadBlank()">
					Download Blank Template
				</button>
				<button class="btn-success" onclick="downloadFilled()">
					Download Filled Version
				</button>
			</div>
		</div>

		<script>
			let numAreas = 8;
			let ratingScale = 10;
			let displayStyle = "filled";
			let labels = [];
			let ratings = [];

			function init() {
				numAreas = parseInt(document.getElementById("numAreas").value);
				ratingScale = parseInt(document.getElementById("ratingScale").value);
				displayStyle = document.getElementById("displayStyle").value;

				labels = Array(numAreas)
					.fill("")
					.map((_, i) => labels[i] || `Area ${i + 1}`);
				ratings = Array(numAreas)
					.fill(0)
					.map((_, i) => ratings[i] || 0);

				createInputs();
				drawWheel();
			}

			function createInputs() {
				const labelsGrid = document.getElementById("labelsGrid");
				const ratingsGrid = document.getElementById("ratingsGrid");

				labelsGrid.innerHTML = "";
				ratingsGrid.innerHTML = "";

				for (let i = 0; i < numAreas; i++) {
					const labelGroup = document.createElement("div");
					labelGroup.className = "label-input-group";
					labelGroup.innerHTML = `
			            <label>Area ${i + 1} Label:</label>
			            <input type="text" value="${
										labels[i]
									}" onchange="updateLabel(${i}, this.value)">
			        `;
					labelsGrid.appendChild(labelGroup);

					const ratingGroup = document.createElement("div");
					ratingGroup.className = "rating-input-group";
					ratingGroup.innerHTML = `
			            <label>${labels[i]}:</label>
			            <input type="number" min="0" max="${ratingScale}" value="${ratings[i]}"
			                onchange="updateRating(${i}, this.value)">
			        `;
					ratingsGrid.appendChild(ratingGroup);
				}
			}

			function updateLabel(index, value) {
				labels[index] = value;
				createInputs();
				drawWheel();
			}

			function updateRating(index, value) {
				ratings[index] = Math.min(parseInt(value) || 0, ratingScale);
				drawWheel();
			}

			function drawWheel(showRatings = true) {
				const canvas = document.getElementById("wheelCanvas");
				const ctx = canvas.getContext("2d");
				const centerX = canvas.width / 2;
				const centerY = canvas.height / 2;
				const radius = 220;
				const labelPadding = 40;

				ctx.clearRect(0, 0, canvas.width, canvas.height);

				// Draw concentric circles
				ctx.strokeStyle = "#ddd";
				ctx.lineWidth = 1;
				for (let i = 1; i <= ratingScale; i++) {
					ctx.beginPath();
					ctx.arc(centerX, centerY, (radius / ratingScale) * i, 0, Math.PI * 2);
					ctx.stroke();
				}

				// Draw pie slices and labels
				const angleStep = (Math.PI * 2) / numAreas;

				for (let i = 0; i < numAreas; i++) {
					const startAngle = angleStep * i - Math.PI / 2;
					const endAngle = startAngle + angleStep;
					const midAngle = startAngle + angleStep / 2;

					// Draw slice lines
					ctx.strokeStyle = "#333";
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.moveTo(centerX, centerY);
					ctx.lineTo(
						centerX + Math.cos(startAngle) * radius,
						centerY + Math.sin(startAngle) * radius
					);
					ctx.stroke();

					// Draw filled ratings if showing
					if (showRatings && ratings[i] > 0) {
						const fillRadius = (radius / ratingScale) * ratings[i];

						if (displayStyle === "filled") {
							// Filled segment style
							const gradient = ctx.createRadialGradient(
								centerX,
								centerY,
								0,
								centerX,
								centerY,
								fillRadius
							);
							gradient.addColorStop(0, "rgba(102, 126, 234, 0.3)");
							gradient.addColorStop(1, "rgba(118, 75, 162, 0.6)");

							ctx.fillStyle = gradient;
							ctx.beginPath();
							ctx.moveTo(centerX, centerY);
							ctx.arc(centerX, centerY, fillRadius, startAngle, endAngle);
							ctx.closePath();
							ctx.fill();
						}

						// Draw labels curved along the circle
						ctx.fillStyle = "#333";
						ctx.font = "bold 11px Arial";
						ctx.textAlign = "center";
						ctx.textBaseline = "middle";

						// Convert label to uppercase
						const labelText = labels[i].toUpperCase();

						// Calculate the arc length available for this slice
						const textPadding = 7; // Reduced padding
						const arcLength = (radius + textPadding) * angleStep;
						const charWidth = 7; // Approximate character width
						const maxChars = Math.floor(arcLength / charWidth);

						// Wrap text to fit within the slice width
						const words = labelText.split(" ");
						const lines = [];
						let currentLine = "";

						for (let j = 0; j < words.length; j++) {
							const testLine =
								currentLine + (currentLine ? " " : "") + words[j];
							if (testLine.length > maxChars && currentLine) {
								lines.push(currentLine);
								currentLine = words[j];
							} else {
								currentLine = testLine;
							}
						}
						if (currentLine) lines.push(currentLine);

						// Draw each line curved along the circle (from inside out)
						const lineSpacing = 15;
						for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
							const line = lines[lineIdx];
							const radiusForLine =
								radius + textPadding + lineIdx * lineSpacing;

							// Calculate angle span for this text
							const textAngleSpan = (line.length * charWidth) / radiusForLine;
							const textStartAngle = midAngle - textAngleSpan / 2;

							ctx.save();

							// Draw each character along the arc
							for (let charIdx = 0; charIdx < line.length; charIdx++) {
								const char = line[charIdx];
								const charAngle =
									textStartAngle + (charIdx * charWidth) / radiusForLine;

								const charX = centerX + Math.cos(charAngle) * radiusForLine;
								const charY = centerY + Math.sin(charAngle) * radiusForLine;

								ctx.save();
								ctx.translate(charX, charY);
								ctx.rotate(charAngle + Math.PI / 2);
								ctx.fillText(char, 0, 0);
								ctx.restore();
							}

							ctx.restore();
						}
					}

					// Draw outer circle
					ctx.strokeStyle = "#333";
					ctx.lineWidth = 3;
					ctx.beginPath();
					ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
					ctx.stroke();

					// Draw center point
					ctx.fillStyle = "#667eea";
					ctx.beginPath();
					ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
					ctx.fill();

					// Draw spider web connections if that style is selected
					if (showRatings && displayStyle === "spider") {
						ctx.strokeStyle = "rgba(118, 75, 162, 0.8)";
						ctx.fillStyle = "rgba(102, 126, 234, 0.3)";
						ctx.lineWidth = 3;

						ctx.beginPath();
						for (let i = 0; i < numAreas; i++) {
							const angle = angleStep * i - Math.PI / 2;
							const pointRadius = (radius / ratingScale) * ratings[i];
							const x = centerX + Math.cos(angle) * pointRadius;
							const y = centerY + Math.sin(angle) * pointRadius;

							if (i === 0) {
								ctx.moveTo(x, y);
							} else {
								ctx.lineTo(x, y);
							}
						}
						ctx.closePath();
						ctx.fill();
						ctx.stroke();

						// Draw points at each rating position
						ctx.fillStyle = "#764ba2";
						for (let i = 0; i < numAreas; i++) {
							const angle = angleStep * i - Math.PI / 2;
							const pointRadius = (radius / ratingScale) * ratings[i];
							const x = centerX + Math.cos(angle) * pointRadius;
							const y = centerY + Math.sin(angle) * pointRadius;

							ctx.beginPath();
							ctx.arc(x, y, 5, 0, Math.PI * 2);
							ctx.fill();
						}
					}
				}
			}

			function downloadBlank() {
				const canvas = document.getElementById("wheelCanvas");
				const ctx = canvas.getContext("2d");

				ctx.clearRect(0, 0, canvas.width, canvas.height);
				drawWheelForDownload(false);

				const link = document.createElement("a");
				link.download = "wheel-of-life-blank.png";
				link.href = canvas.toDataURL();
				link.click();

				drawWheel();
			}

			function downloadFilled() {
				const canvas = document.getElementById("wheelCanvas");

				drawWheelForDownload(true);

				const link = document.createElement("a");
				link.download = "wheel-of-life-filled.png";
				link.href = canvas.toDataURL();
				link.click();
			}

			function drawWheelForDownload(showRatings) {
				const canvas = document.getElementById("wheelCanvas");
				const ctx = canvas.getContext("2d");

				ctx.fillStyle = "white";
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				drawWheel(showRatings);
			}

			document.getElementById("numAreas").addEventListener("change", init);
			document.getElementById("ratingScale").addEventListener("change", init);
			document.getElementById("displayStyle").addEventListener("change", () => {
				displayStyle = document.getElementById("displayStyle").value;
				drawWheel();
			});

			init();
		</script>
	</body>
</html>
